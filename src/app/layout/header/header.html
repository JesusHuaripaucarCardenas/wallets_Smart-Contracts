<header class="app-header">
  <a href="#" class="app-header__brand">
    <span class="app-header__logo">🧺</span>
    <span class="app-header__brand-text">
      <strong>{{ appName }}</strong>
      <small>Mercado de barrio, Cañete</small>
    </span>
  </a>

  <nav class="app-header__nav" aria-label="Navegación principal">
    <a href="#catalogo">Catálogo</a>
    <a href="#checkout">Pagar con cripto</a>
  </nav>

  <div class="app-header__status">
    @if (isConnected()) {
      <span class="app-header__badge app-header__badge--online">
        ● {{ account().networkName }} · {{ account().address | shortAddress }}
      </span>
    } @else {
      <span class="app-header__badge app-header__badge--offline">● Billetera desconectada</span>
    }
  </div>
</header>
